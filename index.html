<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNG MUSIC</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- Brand Atas -->
        <div class="top-brand glass-panel">
            <i class="fa-solid fa-waveform"></i> <span>KNG ONLINE</span>
        </div>

        <div class="player-container">
            <!-- Bagian Kiri: Now Playing -->
            <div class="now-playing glass-panel">
                <div class="panel-header">
                    <h2>Now Playing</h2>
                </div>
                
                <div class="cover-art">
                    <img id="currentCover" src="assets/img/cover-blue.jpg" alt="Cover Art">
                </div>

                <div class="song-info">
                    <h3 id="songTitle">DJ Ghost</h3>
                    <p id="songArtist">DJ Komang Rimex • Justin Bieber • 2022</p>
                </div>

                <div class="controls">
                    <button id="shuffleBtn"><i class="fa-solid fa-shuffle"></i></button>
                    <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="play-btn" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
                    <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
                    <button id="repeatBtn" class="repeat-btn">
                        <i class="fa-solid fa-repeat"></i>
                        <span id="repeatIndicator" class="repeat-badge" style="display: none;">1</span>
                    </button>
                </div>

                <!-- Progress Bar Lagu -->
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-filled" id="progressFilled"></div>
                        </div>
                    </div>
                    <span class="time" id="totalDuration">0:00</span>
                </div>

                <!-- Bar Volume Terkunci Rapi & Sejajar -->
                <div class="volume-container">
                    <i class="fa-solid fa-volume-high"></i>
                    <div class="volume-bar-wrapper">
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" class="vol-slider">
                    </div>
                    <div class="volume-spacer"></div>
                </div>
            </div>

            <!-- Bagian Kanan: Playlist -->
            <div class="playlist glass-panel">
                <div class="panel-header">
                    <h2>Up Next • <span id="playlistCount">0</span> Songs</h2>
                    <button class="add-btn"><i class="fa-solid fa-plus"></i></button>
                </div>
                
                <div class="song-list" id="songListContainer"></div>
            </div>
        </div>

        <!-- Bagian Footer / Share & Copyright -->
        <div class="footer-share glass-panel">
            <div class="footer-top-row">
                <button class="share-main-btn" id="shareBtn">Connect & Share</button>
                <div class="social-buttons">
                    <a href="#" id="shareFB" class="soc-btn fb" target="_blank"><i class="fa-brands fa-facebook-f"></i> Facebook</a>
                    <a href="#" id="shareMsg" class="soc-btn msg" target="_blank"><i class="fa-brands fa-facebook-messenger"></i> Messenger</a>
                    <a href="#" id="shareWA" class="soc-btn wa" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                </div>
            </div>
            <div class="footer-copyright">
                &copy; kngonline 2026 | KNG MUSIC
            </div>
        </div>
    </div>

    <audio id="audioElement"></audio>
    <script src="js/script.js"></script>
</body>
</html>
